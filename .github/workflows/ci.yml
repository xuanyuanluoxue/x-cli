name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Run full test suite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\pytest" | Out-Null
          $env:TMP = "$env:RUNNER_TEMP\pytest"
          $env:TEMP = "$env:RUNNER_TEMP\pytest"
          .\.venv\Scripts\python.exe -m pytest -q

  web-artifacts:
    name: Reproduce Web artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked Web dependencies
        working-directory: web
        run: npm ci

      - name: Build Web frontend
        working-directory: web
        run: npm run build

      - name: Verify committed artifacts match source
        shell: bash
        run: |
          changes="$(git status --porcelain -- core/web/static)"
          if [[ -n "$changes" ]]; then
            echo "core/web/static is stale; run 'cd web && npm ci && npm run build'."
            git status --short -- core/web/static
            exit 1
          fi

      - name: Check whitespace
        run: git diff --check
