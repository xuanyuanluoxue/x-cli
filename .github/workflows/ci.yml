name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} / Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"
          - "3.14"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development environment
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run full test suite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\pytest" | Out-Null
          $env:TMP = "$env:RUNNER_TEMP\pytest"
          $env:TEMP = "$env:RUNNER_TEMP\pytest"
          python -m pytest -q

  quality:
    name: Coverage and critical static checks / Linux
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Pyflakes checks
        run: python -m ruff check core plugins x.py scripts tests

      - name: Enforce coverage floor
        run: >-
          python -m pytest
          --cov=core
          --cov=plugins
          --cov=x
          --cov-report=term
          --cov-fail-under=80
          -q

  web-artifacts:
    name: Reproduce Web artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked Web dependencies
        working-directory: web
        run: npm ci

      - name: Audit Web development dependencies
        working-directory: web
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Build Web frontend
        working-directory: web
        run: npm run build

      - name: Verify committed artifacts match source
        shell: bash
        run: |
          changes="$(git status --porcelain -- core/web/static)"
          if [[ -n "$changes" ]]; then
            echo "core/web/static is stale; run 'cd web && npm ci && npm run build'."
            git status --short -- core/web/static
            exit 1
          fi

      - name: Check whitespace
        run: git diff --check
